<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El avatar de Sofía · Misión ciudadanía digital</title>
<style>
:root{--bg:#f3f4ff;--bg2:#e3e6ff;--card:#fff;--bd:#d9ddf5;--tx:#171a3a;--mut:#5b6390;--a:#6d4aff;--b:#0891b2;--ok:#059669;--warn:#e11d48;--gold:#d97706;--sh:0 10px 30px rgba(60,60,140,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--bg2:#1a1f45;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--tx:#eef1ff;--mut:#a9b2d9;--a:#8b6cff;--b:#22d3ee;--ok:#34d399;--warn:#fb7185;--gold:#fbbf24;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--bg2:#1a1f45;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--tx:#eef1ff;--mut:#a9b2d9;--a:#8b6cff;--b:#22d3ee;--ok:#34d399;--warn:#fb7185;--gold:#fbbf24;--sh:0 10px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--a) 30%,transparent),transparent),radial-gradient(800px 500px at 100% 0,color-mix(in srgb,var(--b) 25%,transparent),transparent),var(--bg);background-color:var(--bg);min-height:100vh;line-height:1.5}
.wrap{max-width:860px;margin:auto;padding:16px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.st{font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);background:var(--card)}
.st.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border-color:transparent;font-weight:700}
.st.ok{color:var(--ok);border-color:var(--ok)}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);border:1px solid var(--gold);margin-left:4px;cursor:help}
.prog-wrap{width:100%;margin:4px 0 12px}
.prog-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.prog-track{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s ease}
.badge-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.badge-item:last-child{border-bottom:none}
.badge-ic{font-size:22px;flex:none}
.badge-item b{display:block;font-size:13px}
.badge-item .mut{font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:var(--sh);backdrop-filter:blur(10px);margin-bottom:16px;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:8px 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px;font-size:22px}
.mut{color:var(--mut)}
.tag{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--b);font-weight:700}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer;transition:transform .15s,opacity .15s;margin-top:10px}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:13px 15px;margin:8px 0;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--a);transform:translateX(3px)}
.opt.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 15%,transparent)}
.opt.done{opacity:.5;cursor:default;border-color:var(--ok)}
.opt.bad{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.zone{cursor:pointer;text-align:center;padding:20px 12px;border-radius:18px;border:1.5px solid var(--bd);background:var(--card);font:inherit;color:var(--tx);transition:.2s}
.zone:hover{transform:translateY(-4px);border-color:var(--b)}
.zone .ic{font-size:40px}
.zone.done{border-color:var(--ok)}
.npc{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--a),var(--b))}
.bub{background:color-mix(in srgb,var(--a) 10%,transparent);border:1px solid var(--bd);border-radius:4px 16px 16px 16px;padding:10px 14px}
.bub b{display:block;font-size:12px;color:var(--b)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin-top:8px}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--a)}
.small{font-size:12px;color:var(--mut)}
.hero{text-align:center;padding:34px 22px}
.hero .big{font-size:64px}
.pill{display:flex;gap:10px;align-items:center}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;cursor:pointer}
.ck input{margin-top:4px;accent-color:var(--a)}
.ov{position:fixed;inset:0;background:rgba(5,8,25,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.on{display:flex}
.ov .card{max-width:620px;max-height:85vh;overflow:auto;background:var(--bg2);width:100%}
.mp{border-left:3px solid var(--a);padding:2px 0 2px 12px;margin:12px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--gold);color:#1a1300;font-weight:800;padding:10px 18px;border-radius:18px;z-index:10;box-shadow:var(--sh);animation:in .4s;max-width:min(90vw,420px);text-align:center;line-height:1.35}
.cert{border:2px dashed var(--gold);text-align:center}
.fork{border:2px solid var(--warn);background:linear-gradient(160deg,color-mix(in srgb,var(--warn) 12%,transparent),var(--card) 55%);position:relative}
.fork .fk-ic{font-size:52px;text-align:center;margin-bottom:4px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.fork .tag{color:var(--warn)}
.fork .opt{border-width:2px}
.fork .opt:hover{border-color:var(--warn)}
.mt{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.zone:disabled{opacity:.4;cursor:not-allowed}
.zone.done:disabled{opacity:.85;cursor:default}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div class="ov" id="ov"><div class="card"><h2>🗺️ Mapa de decisiones</h2><p class="small">Este mapa reemplaza el puntaje: muestra tu recorrido y tus argumentos. La docente lo revisa contigo.</p><div id="mapc"></div><button class="btn g" onclick="$('#ov').classList.remove('on')">Cerrar</button></div></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={l:0,dec:[],bd:[],z:{},ord:[],sel:null,path:'',nm:'',cf:40,im:60,msg:'',er:0};
const DL={id:[[8,-4],[2,4]],pr:[[6,-3],[0,3]],re:[[2,2],[8,-3]],em:[[10,0]]};
function mt(){const b=(l,v,c)=>`<div style="flex:1;min-width:150px"><div class="prog-lbl"><span>${l}</span><span>${v}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${v}%;background:${c}"></div></div></div>`;return `<div class="mt">${b('🤝 Confianza de Sofía',S.cf,'var(--ok)')}${b('🎭 Imagen ante el grupo',S.im,'var(--gold)')}</div><div class="small" style="margin:-4px 0 10px">Ciclo: 👁️ Percibe → 🔎 Interpreta → 🔀 Decide → ✍️ Actúa → ⚙️ Respuesta del sistema → 🔁 Reajusta</div>`}
function fx(c,i){S.cf=Math.max(0,Math.min(100,S.cf+c));S.im=Math.max(0,Math.min(100,S.im+i));const g=n=>(n>0?'+':'')+n;return `<p class="small">Efecto en la historia → 🤝 Confianza ${g(c)} · 🎭 Imagen ${g(i)}</p>`}
const NM=['Huella digital','Territorios','Bifurcación ética','Reparación','Cierre'],RT=['Resolver','Explorar','Negociar','Negociar','Integrar'];
const TL=['Con dos amigos, creas un perfil falso para burlarte de Sofía','Publicas la primera burla en el perfil falso','Compañeros comparten capturas de pantalla del contenido','Aparecen comentarios anónimos que suman más burlas','Sofía deja de participar en las actividades grupales','El perfil es reportado y la docente lo proyecta en clase'];
const ZN=[
{id:'id',ic:'🎭',n:'Identidad digital',np:'Voces anónimas',ni:'👤',intro:'Las Voces anónimas susurran: «Si nadie sabe que fuiste tú, nadie puede culparte».',q:'¿Es igual de grave publicar algo dañino en anónimo que hacerlo con tu nombre puesto?',o:[['Sí, es igual de grave: el daño no depende de si firmaste o no','Las Voces asienten despacio: el rastro sigue ahí —capturas, testigos, huellas— aunque tu nombre nunca apareciera.'],['No exactamente igual: el anonimato reduce el riesgo para quien publica, aunque no borra lo que sintió Sofía','Las Voces susurran de nuevo: protegerte de las consecuencias y borrar el daño son dos cosas distintas. ¿Cuál pesó más en tu respuesta?']],p:'Defiende tu postura: ¿qué harías si tuvieras que sostenerla frente al Comité?',m:25},
{id:'pr',ic:'🔒',n:'Privacidad',np:'Comité de Convivencia Digital',ni:'🛡️',intro:'Un compañero te cuenta en privado que su familia pasa por un momento difícil. Un amigo te pide la captura del chat «para un meme».',q:'¿Qué haces con esa información?',o:[['Se lo cuento a una profesora de confianza, sin mostrar la conversación, para que sepa cómo acompañarlo','El Comité anota tu gesto, aunque plantea una duda: tu compañero no sabe que hablaste por él. ¿La ayuda vale igual si llega sin que él lo pidiera?'],['No se lo cuento a nadie, tal como me lo pidió, y confío en que estar ahí para escucharlo sea suficiente','El Comité respeta tu palabra, pero pregunta: si la situación se agrava, ¿bastará con que tú lo hayas escuchado?']],p:'¿Qué pesó más en tu decisión: la promesa que hiciste o el riesgo de que él necesite más ayuda?',m:25},
{id:'em',ic:'💌',n:'Empatía',np:'Sofía',ni:'🧑‍🎓',intro:'Antes de las burlas, Sofía participaba en todo. Hoy casi no habla en clase.',q:'',o:[],p:'Escribe una carta desde la perspectiva de Sofía: ¿qué sintió, qué dejó de hacer, qué necesitaba de sus compañeros?',m:80},
{id:'re',ic:'⚖️',n:'Responsabilidad',np:'Comité de Convivencia Digital',ni:'🛡️',intro:'Revisas las normas de convivencia digital del colegio. Debes proponer un ajuste concreto.',q:'¿Qué ajuste propondrías?',o:[['Sanciones claras y visibles para quien publique burlas, como principal medida disuasiva','El Comité reconoce que una sanción clara frena comportamientos, aunque plantea una duda: ¿basta con cumplir un castigo para entender por qué la norma existe?'],['Un protocolo centrado en reparar el daño y acompañar a quien lo causó, sin sanciones fijas','El Comité valora el enfoque formativo, pero pregunta: sin ninguna consecuencia clara, ¿toma en serio la norma quien todavía no mide el daño que hace?']],p:'Redacta el ajuste como norma: ¿quién, cuándo y cómo se aplica?',m:40}];
const CM=['Pensaré en el alcance de mis palabras antes de publicar.','No compartiré información privada de otra persona sin su permiso.','No participaré en perfiles falsos ni burlas anónimas.','Reportaré el acoso digital y acompañaré a quien lo sufre.','Repararé el daño cuando me equivoque, sin justificarme.','Usaré las redes para construir comunidad, no para ganar aprobación.'];
const BD={'🔎 Rastreador de huellas':'Reconstruiste cómo se propagó el perfil falso: comprendiste que las huellas digitales no se borran, aunque el nombre esté oculto.','🧭 Explorador ético':'Elegiste tres de los cuatro territorios y tomaste postura argumentada en cada uno, sabiendo que lo que dejaste sin explorar también cuenta.','⚖️ Voz con conciencia':'En el momento de mayor presión social, elegiste reconocer el daño en vez de ocultarlo.','🕊️ Mediador digital':'Reparaste con tus palabras, escuchaste a Sofía y firmaste un compromiso real con el curso.'};
function hud(){const p=Math.round(S.l/NM.length*100);return mt()+`<div class="prog-wrap"><div class="prog-lbl"><span>Nivel ${S.l} de ${NM.length} · ${NM[S.l-1]||''} · Ruta: ${RT[S.l-1]||''}</span><span>${p}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${p}%"></div></div></div><div class="hud"><div class="steps">${NM.map((n,i)=>`<span class="st ${S.l===i+1?'on':S.l>i+1?'ok':''}">${i+1}. ${n}</span>`).join('')}</div><div><button class="btn g" style="margin:0;padding:6px 12px" onclick="mapa()">🗺️ Mapa</button>${S.bd.map(b=>`<span class="chip" title="${e(BD[b]||'')}">${b}</span>`).join('')}</div></div>`}
function view(l,h){S.l=l;$('#app').innerHTML=(l?hud():'')+h;window.scrollTo(0,0)}
function log(l,t,a){S.dec.push({l,t,a})}
function badge(t){if(S.bd.includes(t))return;S.bd.push(t);const d=document.createElement('div');d.className='toast';d.innerHTML=`🏅 Nueva insignia: ${e(t)}<br><span style="font-weight:400;font-size:12px">${e(BD[t]||'')}</span>`;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}
function npc(i,n,t){return `<div class="npc"><div class="av">${i}</div><div class="bub"><b>${n}</b>${t}</div></div>`}
function okarg(v,m){v=v.trim();return v.length>=m&&new Set(v.toLowerCase().split(/\s+/).filter(x=>x.length>1)).size>=6}
function ta(id,ph,m,btn){return `<textarea id="${id}" placeholder="${ph}" oninput="$('#${btn}').disabled=!okarg(this.value,${m})"></textarea><div class="small">Explica con tus palabras (mínimo ${m} caracteres y al menos 6 palabras distintas).</div>`}
function mapa(){const bh=S.bd.length?`<h2 style="font-size:16px;margin-top:4px">🏅 Insignias obtenidas</h2>${S.bd.map(b=>`<div class="badge-item"><div class="badge-ic">${b.split(' ')[0]}</div><div><b>${e(b.slice(b.indexOf(' ')+1))}</b><div class="mut">${e(BD[b]||'')}</div></div></div>`).join('')}`:'';$('#mapc').innerHTML=bh+(S.dec.length?S.dec.map(d=>`<div class="mp"><span class="tag">Nivel ${d.l}</span><br><b>${e(d.t)}</b><div class="mut">${e(d.a)}</div></div>`).join(''):'<p class="mut">Aún no hay decisiones. ¡Empieza la misión!</p>');$('#ov').classList.add('on')}
function intro(){S.l=0;S.dec=[];S.bd=[];S.z={};S.ord=[];S.sel=null;S.cf=40;S.im=60;S.msg='';S.er=0;S.ev=null;S.evr=false;shuf();view(0,`<div class="card hero"><div class="big">📱🧑‍🎓</div><span class="tag">Misión de ciudadanía digital · Grado 9°</span><h1>El avatar de Sofía</h1><p class="mut">Tecnología e Informática · Recorre el territorio digital, comprende el alcance de tus actos y decide si ocultas el daño o lo reparas.</p><button class="btn" onclick="pro()">Comenzar misión ▶</button></div><div class="card"><h2 style="font-size:17px">🎮 Cómo se juega</h2><div style="text-align:left"><p class="mut" style="margin:6px 0"><b>Objetivo:</b> reparar la confianza con Sofía decidiendo y explicando cada paso.</p><p class="mut" style="margin:6px 0"><b>Cada nivel:</b> lees la situación, decides entre dos caminos razonables y explicas por escrito por qué.</p><p class="mut" style="margin:6px 0"><b>Consecuencias:</b> cada decisión mueve 🤝 Confianza de Sofía y 🎭 Imagen ante el grupo, y esos medidores cambian lo que pasa después (costos, presión y reglas). Solo tendrás tiempo para 3 de las 4 zonas y a mitad del recorrido puede surgir un evento inesperado que cambia las condiciones.</p><p class="mut" style="margin:6px 0"><b>Final:</b> terminas con la confianza restaurada, en reconstrucción o frágil. No hay game over: si justificas el daño ante Sofía, puedes intentarlo de nuevo, y al final puedes volver a jugar por otro camino.</p></div></div>`)}
function rs(){const c=S.cf,i=S.im;return c>=70&&i>=40?`🤝 Confianza de Sofía restaurada (${c}%) y con apoyo del grupo (imagen ${i}%). Reparaste asumiendo el costo.`:c>=70?`🤝 Sofía volvió a confiar en ti (${c}%), pero tu imagen ante el grupo quedó baja (${i}%): reparar te costó apoyo. Ahora toca reconstruir esos vínculos.`:c>=40?`🌱 Confianza en reconstrucción (${c}%). Imagen: ${i}%. Sofía te da una oportunidad; falta sostener tus acciones.`:`⚠️ Confianza frágil (${c}%). Imagen: ${i}%. Ocultar o justificar tuvo un costo real: prueba otro camino.`}
function pro(){view(0,`<div class="card"><span class="tag">Prólogo</span><h2>Tú eres Mateo</h2><p class="mut">Hábil con la tecnología y siempre buscando la aprobación de tus compañeros. Junto a dos amigos creaste un perfil falso para burlarte de Sofía, la estudiante nueva.</p>${npc('👩‍🏫','Docente · Game master','Hoy proyecto una notificación anónima: el perfil falso fue reportado. Sofía ya no participa en los trabajos grupales. Tu misión, Mateo: recorrer el territorio digital, comprender el alcance real de tus actos y decidir si ocultas el daño o lo reparas.')}<p class="small">Aquí no hay puntaje que ganar: cada decisión mueve dos medidores —la confianza de Sofía y tu imagen ante el grupo— y esos cambios modifican lo que viene después. Se avanza decidiendo y explicándolo por escrito.</p><button class="btn" onclick="n1()">Entrar al Nivel 1 ▶</button></div>`)}
let SH=[];const shuf=()=>{SH=[...TL.keys()].sort(()=>Math.random()-.5)};shuf();
const EV=[{t:'📸 Se filtran nuevas capturas del perfil falso en el grupo de WhatsApp del curso.',o:[['Pedir que las borren y reportar el grupo',[4,-6]],['Quedarme en silencio para no llamar la atención',[-5,4]]]},{t:'💬 Un compañero te escribe: «Si hablas con Sofía, te dejamos fuera del equipo del proyecto».',o:[['Mantenerme firme aunque me quede sin equipo',[5,-8]],['Ceder para conservar mi equipo',[-4,6]]]},{t:'📣 Sofía publica un mensaje contando cómo se sintió y varios compañeros lo comentan.',o:[['Escribirle un mensaje privado reconociendo mi parte',[5,-2]],['Dar like sin decir nada',[-3,3]]]}];
function evt(){if(!S.ev)S.ev=EV[Math.floor(Math.random()*EV.length)];const v=S.ev;view(2,`<div class="card fork"><span class="tag">⚡ Evento inesperado</span><h2>Cambian las condiciones</h2><p class="mut">Algo ocurre a mitad del recorrido. Decide rápido: no necesitas explicarlo, pero queda en tu mapa.</p>${npc('📣','Notificación',v.t)}${v.o.map((o,i)=>`<button class="opt" onclick="ev(${i})">${o[0]}</button>`).join('')}</div>`)}
function ev(i){const o=S.ev.o[i];log(2,'Evento inesperado: '+S.ev.t,o[0]);S.evr=true;S.msg=(S.msg||'')+fx(o[1][0],o[1][1]);hub()}
function n1(){const ok=S.ord.length===TL.length;view(1,`<div class="card"><span class="tag">Nivel 1</span><h2>👣 Huella digital</h2>${npc('🛡️','Comité de Convivencia Digital','Ayúdanos a reconstruir cómo se propagó todo. Toca los hechos en el orden en que ocurrieron.')}${SH.map(i=>{const p=S.ord.indexOf(i);return `<button class="opt ${p>=0?'done':''}" onclick="tl(${i})">${p>=0?'✅ '+(p+1)+'. ':''}${TL[i]}</button>`}).join('')}${ok?`<h2 style="margin-top:18px">¿Qué habría cambiado?</h2><p class="mut">Argumenta qué habría pasado si hubieras medido el alcance de tus palabras.</p>${ta('t1','Escribe tu argumento...',40,'b1')}<button class="btn" id="b1" disabled onclick="f1()">Guardar en el mapa ▶</button>`:''}</div>`)}
function tl(i){if(S.ord.includes(i))return;if(i===S.ord.length){S.ord.push(i);n1()}else{S.er++;const b=[...document.querySelectorAll('.opt')].find(x=>x.getAttribute('onclick')==`tl(${i})`);b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}}
function f1(){log(1,'Línea de tiempo y alcance de mis palabras ('+S.er+' intentos fallidos)',$('#t1').value.trim());badge('🔎 Rastreador de huellas');const d=S.er<=1?[6,0]:S.er<=4?[3,0]:[0,0];S.msg='<p class="small">Cronología: '+(S.er<=1?'la reconstruiste con claridad, y eso te da bases sólidas para hablar con Sofía.':S.er<=4?'la reconstruiste con algunos errores; entender el alcance te costó más.':'la reconstruiste con muchos errores; te falta claridad sobre el alcance del daño.')+'</p>'+fx(d[0],d[1]);hub()}
function hub(){const n=Object.keys(S.z).length;if(n===2&&!S.evr){evt();return}const m=S.msg||'';S.msg='';view(2,`<div class="card"><span class="tag">Nivel 2</span><h2>🗺️ Territorios temáticos</h2><p class="mut">El Comité solo te da tiempo para <b>tres</b> de las cuatro zonas. Elige cuáles explorar: lo que dejes sin recorrer también condiciona lo que sabrás al decidir.</p>${m}${n>0?`<p class="small">💡 ${S.cf<40?'La confianza de Sofía está baja: piensa qué zona te ayudaría a reparar.':S.im<40?'Tu imagen ante el grupo está baja: reparar cuesta, pero pesa más.':'Vas equilibrando confianza e imagen: la zona que dejes sin explorar también cuenta.'}</p>`:''}<div class="grid">${ZN.map(z=>{const lk=n>=3&&!S.z[z.id];return `<button class="zone ${S.z[z.id]?'done':''}" ${lk||S.z[z.id]?'disabled':''} onclick="zn('${z.id}')"><div class="ic">${z.ic}</div><b>${z.n}</b><div class="small">${S.z[z.id]?'✅ Completado':lk?'⏳ Sin tiempo':z.np}</div></button>`}).join('')}</div>${n>=3?`<button class="btn" onclick="badge('🧭 Explorador ético');n3()">Llegó el momento de decidir ▶</button>`:`<p class="small">Zonas completadas: ${n}/3</p>`}</div>`)}
function zn(id){const z=ZN.find(x=>x.id===id);S.sel=null;view(2,`<div class="card"><span class="tag">${z.ic} ${z.n}</span>${npc(z.ni,z.np,z.intro)}${z.q?`<h2>${z.q}</h2>${z.o.map((o,i)=>`<button class="opt" onclick="pk('${id}',${i})">${o[0]}</button>`).join('')}`:''}<div id="rx"></div><div id="wr" style="${z.q?'display:none':''}"><p class="mut">${z.p}</p>${ta('tz','Escribe aquí...',z.m,'bz')}<button class="btn" id="bz" disabled onclick="sz('${id}')">Guardar en el mapa ▶</button></div><button class="btn g" onclick="hub()">← Volver al mapa</button></div>`)}
function pk(id,i){const z=ZN.find(x=>x.id===id);S.sel=i;document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('sel',k===i));$('#rx').innerHTML=npc(z.ni,z.np,z.o[i][1]);$('#wr').style.display='block'}
function sz(id){const z=ZN.find(x=>x.id===id),d=DL[id][z.q?S.sel:0];log(2,z.n+(z.q?' · '+z.q:''),(z.q?z.o[S.sel][0]+' — ':'')+$('#tz').value.trim());S.z[id]=1;S.msg=fx(d[0],d[1]);hub()}
function n3(){const om=ZN.find(z=>!S.z[z.id]),pr=S.im>=60?'«Si hablas, te quedas solo: tenemos mucho que perder.»':'«Ya casi no quedamos del grupo. Haz lo que creas, pero piénsalo.»';view(3,`<div class="card fork"><div class="fk-ic">🔀</div><span class="tag">Nivel 3 · El momento decisivo</span><h2>Bifurcación ética</h2>${npc('👩‍🏫','Docente','Todo el curso espera. Puedes sostener tu posición social ocultando tu autoría, o reconocer ante todos lo que hiciste. No alcanzaste a explorar «'+om.n+'»: decides con lo que sabes, y tendrás que explicar tu decisión.')}${npc('👥','Tus amigos',pr)}<button class="opt" onclick="bf('oculta')">🫥 Ocultar mi autoría y sostener mi posición</button><button class="opt" onclick="bf('repara')">🤝 Reconocer lo que hice y reparar el daño</button><div id="bw"></div></div>`)}
function bf(p){S.path=p;document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('sel',(k===0)===(p==='oculta')));$('#bw').innerHTML=`<p class="mut">Argumenta tu decisión y las razones que la sostienen.</p>${ta('t3','Mi decisión es... porque...',50,'b3')}<button class="btn" id="b3" disabled onclick="cf()">Confirmar decisión ▶</button>`}
function cf(){const a=$('#t3').value.trim(),f=S.path==='repara'?fx(15,S.im>=60?-25:-12):fx(-15,10);log(3,'Bifurcación ética',(S.path==='oculta'?'Ocultar autoría — ':'Reconocer y reparar — ')+a);if(S.path==='repara'){badge('⚖️ Voz con conciencia');view(3,`<div class="card fork"><div class="fk-ic">🤝</div><span class="tag">Consecuencias</span><h2>El costo de hablar</h2>${npc('🛡️','Comité de Convivencia Digital','Reconocer tu autoría abre el proceso de reparación, aunque no borra lo ocurrido.')}${npc('👥','Un compañero','«¿Para qué hablaste? Ahora todos saben que fuiste tú.»')}<p class="mut">Tu decisión quedó registrada en el mapa. Hablar tuvo un costo, pero también abrió una puerta.</p>${f}<button class="btn" onclick="n4()">Continuar ▶</button></div>`)}else{view(3,`<div class="card fork"><div class="fk-ic">😔</div><span class="tag">Consecuencias</span><h2>El camino del silencio</h2>${npc('🛡️','Comité de Convivencia Digital','Sin tu voz, el Comité avanza solo con lo que otros vieron.')}${npc('🧑‍🎓','Sofía','Mensaje sin leer: «Ya no sé a quién más pedirle ayuda».')}<p class="mut">Tu decisión quedó registrada en el mapa. El proceso sigue, con o sin tu voz.</p>${f}<button class="btn" onclick="n4()">Continuar ▶</button></div>`)}}
function p2(){return S.dec.some(d=>d.l===3)&&S.dec.filter(d=>d.l===3).length>0?'Ajuste · ':''}
function n4(){const m=S.msg||'';S.msg='';view(4,`<div class="card"><span class="tag">Nivel 4</span><h2>💬 Conversación con Sofía</h2><p class="mut">La docente media el encuentro. ¿Cómo empiezas?</p>${m}${['Lo siento, pero todos lo hacían.','Lo que hice estuvo mal y te hizo daño. No busco justificarme.','Fue solo una broma, no era para tanto.'].map((t,i)=>`<button class="opt" onclick="cv(${i})">${t}</button>`).join('')}<div id="cr"></div></div>`)}
const CR=['Sofía baja la mirada: «Eso no cambia lo que sentí». La docente pide que lo intentes de nuevo.','Sofía respira hondo: «Gracias por decirlo así. Necesitaba escucharlo». La conversación puede continuar.','Sofía se levanta en silencio. La docente te invita a pensar qué palabras habrían reparado en vez de minimizar.'];
function cv(i){document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('sel',k===i));$('#cr').innerHTML=npc('🧑‍🎓','Sofía',CR[i])+(i===1?(S.cf>=60?`<button class="btn" onclick="log(4,'Conversación con Sofía','Reconocí el daño sin justificarme.');cm()">Continuar ▶</button>`:npc('🧑‍🎓','Sofía','«Gracias por decirlo así, pero las palabras solas ya no me alcanzan. ¿Qué vas a hacer?»')+`<button class="opt" onclick="ra(0)">🤝 Ofrecerle trabajar juntos en las tareas del grupo</button><button class="opt" onclick="ra(1)">📢 Pedir disculpas frente al grupo, aunque cueste mi imagen</button>`):`<button class="btn g" onclick="rt(${i})">Intentarlo de nuevo ↺</button>`)}
function ra(k){log(4,'Acción concreta de reparación',k?'Pedí disculpas frente al grupo':'Ofrecí trabajar juntos en las tareas');S.msg=fx(k?10:7,k?-10:-3);cm()}
function rt(i){log(4,'Conversación con Sofía (primer intento)',i?'Minimicé lo ocurrido':'Me justifiqué con «todos lo hacían»');S.msg=fx(i?-8:-6,i?4:3)+'<p class="small">Sofía no se sintió escuchada: pierdes confianza. Prueba con otras palabras.</p>';n4()}
function cm(){const m=S.msg||'';S.msg='';view(4,`<div class="card"><span class="tag">Nivel 4</span><h2>📜 Compromiso digital del curso</h2>${npc('🛡️','Comité de Convivencia Digital','Construyamos juntos el compromiso. Elige al menos 3 acuerdos que asumirás de verdad.')}${m}${CM.map((c,i)=>`<label class="ck"><input type="checkbox" class="cc" value="${i}" onchange="vc()"><span>${c}</span></label>`).join('')}<input type="text" id="nm" placeholder="Firma con tu nombre" oninput="vc()"><button class="btn" id="bc" disabled onclick="fc()">Firmar compromiso ✍️</button></div>`)}
function vc(){$('#bc').disabled=!(document.querySelectorAll('.cc:checked').length>=3&&$('#nm').value.trim().length>1)}
function fc(){S.nm=$('#nm').value.trim();S.cm=[...document.querySelectorAll('.cc:checked')].map(x=>CM[x.value]);log(4,'Compromiso digital firmado',S.cm.join(' | '));badge('🕊️ Mediador digital');view(5,`<div class="card"><span class="tag">Cierre</span><h2>💭 Antes de terminar</h2><p class="mut">Con las evidencias de tu mapa: ¿qué criterios éticos aplicarás antes de publicar contenido sobre otra persona?</p>${ta('tf','Antes de publicar, yo me preguntaré...',60,'bf')}<button class="btn" id="bf" disabled onclick="fin()">Finalizar misión 🏁</button></div>`)}
function rep(){return 'MAPA DE DECISIONES · El avatar de Sofía\nEstudiante: '+S.nm+'\nInsignias: '+S.bd.join(', ')+'\nConfianza de Sofía: '+S.cf+'% · Imagen ante el grupo: '+S.im+'%\n\n'+S.dec.map(d=>`[Nivel ${d.l}] ${d.t}\n${d.a}`).join('\n\n')}
function fin(){log(5,'Criterios éticos antes de publicar',$('#tf').value.trim());view(5,`<div class="card"><h2 style="font-size:17px">🧭 Cómo terminó tu recorrido</h2><p class="mut">${rs()}</p><button class="btn" onclick="intro()">🔁 Jugar de nuevo y probar otro camino</button></div><div class="card cert"><div style="font-size:54px">🏆</div><span class="tag">Misión cumplida</span><h1>Compromiso digital</h1><p class="mut">Firmado por <b>${e(S.nm)}</b> y el curso</p><div style="text-align:left">${S.cm.map(c=>`<div>✅ ${e(c)}</div>`).join('')}</div><p>${S.bd.map(b=>`<span class="chip" title="${e(BD[b]||'')}">${b}</span>`).join('')}</p></div><div class="card"><h2 style="font-size:17px">💡 La lección de este recorrido</h2><div style="text-align:left"><p class="mut" style="margin:6px 0"><b>🎭 Identidad digital:</b> el anonimato no borra el daño, solo oculta al autor.</p><p class="mut" style="margin:6px 0"><b>🔒 Privacidad:</b> lo que se comparte sin permiso deja de pertenecerte a ti para pasar a herir a otro.</p><p class="mut" style="margin:6px 0"><b>💌 Empatía:</b> detrás de cada burla hay alguien que deja de participar, de hablar, de confiar.</p><p class="mut" style="margin:6px 0"><b>⚖️ Responsabilidad:</b> reparar el daño pesa más que sostener una imagen intachable.</p></div><p class="mut">La ciudadanía digital no es una norma impuesta desde afuera: es una decisión que se construye desde la empatía, decisión a decisión — como muestra tu mapa, no un puntaje.</p></div><div class="card"><h2>📋 Para la docente</h2><p class="mut small">Copia este mapa y comparte tus argumentos en la conversación de cierre.</p><textarea id="rp" readonly>${e(rep())}</textarea><button class="btn" onclick="cp()">Copiar mapa</button> <button class="btn g" onclick="mapa()">Ver mapa</button> <button class="btn g" onclick="intro()">Jugar de nuevo ↺</button></div>`)}
function cp(){const t=$('#rp');t.select();try{navigator.clipboard.writeText(t.value)}catch(x){try{document.execCommand('copy')}catch(y){}}}
intro();
</script>
</body>
</html>
